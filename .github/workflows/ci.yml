name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q scripts tests
      - name: Test
        run: python -m pytest -q
      - name: Generate and package world-ready sample
        run: |
          python scripts/create_project.py \
            --root /tmp \
            --project-dir vfc-ci \
            --profile generic-metric \
            --location "CI Example" \
            --generate
          python scripts/generate_report.py /tmp/vfc-ci --share review
      - name: Validate generated plan
        run: |
          python scripts/validate_plan.py \
            /tmp/vfc-ci/output/plan.json \
            --output /tmp/vfc-ci/output/validation.json \
            --fail-on error
